# docker-compose.override.yml
# Mounts the project_data plugin and updated app/models into the container.
# Run: docker-compose up -d (this file is loaded automatically)
version: "3.4"
services:
  webapp:
    # Wie in docker-compose.yml, davor wird der Zustand des Zeitplaners (celery beat)
    # verworfen. Die Datei hält nur die letzten Laufzeiten. Wird der Container hart
    # beendet (der Server fährt täglich herunter), kann sie unbrauchbar werden; dann
    # stürzt der Zeitplaner bei jedem Start ab ("_dbm.error: cannot add item to
    # database"), alle Knoten gelten als offline und gelöschte Projekte bleiben liegen.
    # Die alte PID-Datei muss auch weg: worker.sh würde sonst per kill -9 den Prozess
    # treffen, der diese Nummer inzwischen trägt.
    # Prüfen, ob der Zeitplaner läuft: docker top webapp | grep beat
    # Bei einem WebODM-Update mit dem entrypoint in docker-compose.yml abgleichen.
    entrypoint: /bin/bash -c "rm -f /webodm/celerybeat-schedule* /webodm/celerybeat.pid; service cron start && chmod +x /webodm/*.sh && /bin/bash -c \"/webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh\""
    volumes:
      - ./coreplugins/project_data:/webodm/coreplugins/project_data:ro
      - ./coreplugins/roof_detect:/webodm/coreplugins/roof_detect:ro
      - ./coreplugins/realign:/webodm/coreplugins/realign
      - ./app/api/potree.py:/webodm/app/api/potree.py:ro       # Roof-S per-user scene patch
      - ./app/models/__init__.py:/webodm/app/models/__init__.py:ro
      - ./app/models/redirect.py:/webodm/app/models/redirect.py:ro
      - ./app/plugins/views.py:/webodm/app/plugins/views.py:ro  # Roof-S csrf_exempt patch (JWT-POST über Plugin)
      - ./app/scripts/glbopti.js:/webodm/app/scripts/glbopti.js:ro  # Roof-S Draco-Fix: quantizationVolume mesh (scene backt UTM in Float32-Vertices)
      - point2cad_data:/data   # shared with point2cad service — CADMeshView reads mesh.ply from here
  worker:
    entrypoint: /bin/bash -c "pip install laspy pygltflib trimesh -q && /webodm/wait-for-postgres.sh db /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start"
    volumes:
      - ./coreplugins/project_data:/webodm/coreplugins/project_data:ro
      - ./coreplugins/roof_detect:/webodm/coreplugins/roof_detect:ro
      - ./coreplugins/realign:/webodm/coreplugins/realign
      - ./app/api/potree.py:/webodm/app/api/potree.py:ro       # Roof-S per-user scene patch
      - ./app/models/__init__.py:/webodm/app/models/__init__.py:ro
      - ./app/models/redirect.py:/webodm/app/models/redirect.py:ro
      - ./app/plugins/views.py:/webodm/app/plugins/views.py:ro  # Roof-S csrf_exempt patch (JWT-POST über Plugin)
      - ./app/scripts/glbopti.js:/webodm/app/scripts/glbopti.js:ro  # Roof-S Draco-Fix: quantizationVolume mesh
      - point2cad_data:/data   # shared with point2cad service
  node-odm-1:
    volumes:
      # NodeODM-Daten auf festem Host-Pfad — die Splat-Pipeline (DooD) liest die
      # Task-Bilder von dort; war bisher nur als Server-Hand-Edit vorhanden.
      - /opt/roof-s/nodeodm-data:/var/www/data

  # point2cad microservice — requires image to be available on the host:
  #   docker load < point2cad.tar   or   docker pull <your-registry>/point2cad:latest
  # Build locally first: cd ~/point2cad/point2cad/build && sh docker_build.sh
  point2cad:
    image: point2cad:latest
    entrypoint: []
    command: python /point2cad_service.py
    volumes:
      - ./coreplugins/roof_detect/point2cad_service.py:/point2cad_service.py:ro
      - point2cad_data:/data
      - ~/point2cad:/work/point2cad:ro
    environment:
      - P2CAD_PORT=8765
      - P2CAD_FORCE_CPU=1   # GTX 1050 has only 2 GiB VRAM — fall back to CPU
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  point2cad_data:
